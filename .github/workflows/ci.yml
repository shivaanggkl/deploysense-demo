name: CI/CD - DeploySense Demo App

on:
  push:
    branches:
      - release/*

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Java setup
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3️⃣ Build JAR
      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests

      # 4️⃣ (Optional) Upload artifact for traceability
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploysense-demo-${{ github.sha }}
          path: target/*.jar

      # 5️⃣ Simulate PROD deploy (important for demo clarity)
      - name: Deploy to PROD
        run: |
          echo "Deploying deploysense-demo to PROD..."
          sleep 5

      # 6️⃣ Notify DeploySense (THIS IS THE MVP TRIGGER)
      - name: Notify DeploySense (Post-Deploy)
        run: |
          curl -X POST https://postanesthetic-calculably-althea.ngrok-free.dev/webhooks/github \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: workflow_run" \
            -d '{
              "workflow_run": {
                "name": "CI/CD - DeploySense Demo App",
                "head_branch": "${{ github.ref_name }}",
                "head_sha": "${{ github.sha }}",
                "conclusion": "success",
                "run_started_at": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"
              },
              "repository": {
                "name": "${{ github.event.repository.name }}",
                "full_name": "${{ github.repository }}"
              }
            }'

